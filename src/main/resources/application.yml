spring:
  application:
    name: starwars-catalog-api
  threads:
    virtual:
      enabled: true
  cache:
    cache-names: swapi
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h,recordStats

server:
  port: ${PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: starwars-catalog-api
      expiration: 1h
    users:
      - username: user
        password-hash: "$2a$10$hyIKNta2TirY7Mj1Mtu6v.UHioYC6nuLTQfWqPTMFcg9G3mDzuyQu"
        roles: [USER]
      - username: admin
        password-hash: "$2a$10$CVz0fr32LAUrWVbEsCvmn..9/lohoGR516UXBSi2v4nVUfQO2ZuGu"
        roles: [USER, ADMIN]

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

swapi:
  base-url: https://www.swapi.tech/api
  connect-timeout: 2s
  read-timeout: 5s
  default-retry-after: 30s

resilience4j:
  retry:
    instances:
      swapi:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - io.github.lionesp.starwarscatalog.adapter.out.swapi.exception.SwapiServerErrorException
          - io.github.lionesp.starwarscatalog.adapter.out.swapi.exception.SwapiConnectionException
  circuitbreaker:
    instances:
      swapi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - io.github.lionesp.starwarscatalog.adapter.out.swapi.exception.SwapiServerErrorException
          - io.github.lionesp.starwarscatalog.adapter.out.swapi.exception.SwapiTimeoutException
          - io.github.lionesp.starwarscatalog.adapter.out.swapi.exception.SwapiConnectionException
          - io.github.lionesp.starwarscatalog.adapter.out.swapi.exception.SwapiBadResponseException
