name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t starwars-catalog-api .
      - name: Smoke test del contenedor
        run: |
          docker run -d --name sw-smoke --memory 512m \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -p 8080:8080 starwars-catalog-api
          if ! curl -sf --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors \
            --max-time 5 -o /dev/null http://localhost:8080/actuator/health; then
            docker logs sw-smoke
            exit 1
          fi
      - name: Logs del contenedor
        if: failure()
        run: docker logs sw-smoke || true
